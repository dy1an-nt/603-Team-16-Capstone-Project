<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Reviewer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header class="site-header">
    <h1>Resume Reviewer</h1>
    <p id="api-status" class="muted">Checking API...</p>
  </header>

  <main>
    <section class="card" id="account">
      <h2>Account</h2>
      <form id="auth-form">
        <p>
          <label for="auth-email">Email</label><br>
          <input type="email" id="auth-email" autocomplete="username" required>
        </p>
        <p>
          <label for="auth-password">Password (at least 8 characters)</label><br>
          <input type="password" id="auth-password" autocomplete="current-password" minlength="8" required>
        </p>
        <button type="submit" id="login-btn">Log in</button>
        <button type="button" id="register-btn">Register</button>
      </form>
      <div id="account-actions" hidden>
        <button type="button" id="logout-btn">Log out</button>
        <button type="button" id="delete-account-btn">Delete account</button>
      </div>
      <p id="account-status" class="muted" role="status"></p>
    </section>

    <section class="card">
      <h2>1. Upload resume</h2>
      <input type="file" id="resume-file" accept=".pdf,.docx">
    </section>

    <section class="card">
      <h2>2. Job description</h2>
      <textarea id="job-text" rows="8" placeholder="Paste the job description"></textarea>
    </section>
    <p id="analysis-privacy-notice" class="muted"> <!-- privacy notice -->
      Resume text will be sent to a third-party LLM/AI-assisted service.
    </p>

    <button id="analyze-btn" type="button">Analyze</button>

    <section class="card" id="results" hidden>
      <h2>Results</h2>
      <div id="results-body"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mock-analysis.js"></script>
  <script src="js/results.js"></script>
</body>

</html>
